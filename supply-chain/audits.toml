[[audits.ureq]]
who = "Claude Code (review recorded for @alazarteka)"
criteria = "safe-to-run"
version = "3.4.2"
notes = "Reviewed as compiled with rustls-no-provider + platform-verifier and no default features. No build.rs or proc macros, #![forbid(unsafe_code)] unconditionally, no process spawning, and no filesystem access beyond caller-supplied File bodies. Connections go only to the request URL, redirect targets or the configured proxy; Config::default() reads ALL_PROXY/HTTPS_PROXY/HTTP_PROXY/NO_PROXY (klms overrides with .proxy(None) and per-request proxies), and fixed hosts appear only in ureq's own cfg(test) tests. Logging goes through the log facade with non-allowlisted headers redacted; paths/queries and Location only at trace. The only thread is a detached DNS-with-timeout helper when a resolve timeout is set."

[[audits.ureq-proto]]
who = "Claude Code (review recorded for @alazarteka)"
criteria = "safe-to-run"
version = "0.6.4"
notes = "Reviewed with only the `client` feature, as ureq enables it. No build.rs (build = false), no proc macros or include!/env!, and #![forbid(unsafe_code)]. No std::net/fs/process/env/thread/time use anywhere in src: the only I/O is io::Write into caller-supplied buffers, consistent with a sans-IO HTTP/1.1 state machine, and there is no global mutable state. Logging is via the log facade; trace! hex-dumps raw request/response bytes (util.rs:73), which only appears if an application enables trace logging (klms installs no logger)."

[[audits.utf8-zero]]
who = "Claude Code (review recorded for @alazarteka)"
criteria = "safe-to-run"
version = "0.8.1"
notes = "Read all of src (lib.rs, read.rs, lossy.rs). No build.rs, proc macros, dependencies or include!. no_std with optional std; no fs/net/process/env access, and BufReadDecoder only consumes a caller-supplied BufRead. The only unsafe is three str::from_utf8_unchecked calls on bytes already validated by str::from_utf8; no FFI, statics or threads."

