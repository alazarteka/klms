
# cargo-vet audits file

[[audits.base64]]
who = "Claude Code (review recorded for @alazarteka)"
criteria = "safe-to-run"
version = "0.23.1"
notes = "No build.rs, proc macros, or include!/env!. Library code does no fs/net/process/env access, uses no FFI and has no static mutable state; the io adapters only wrap caller-supplied Read/Write. All unsafe is confined to src/engine/simd.rs behind the default `simd-unsafe` feature (AVX2/NEON intrinsics with bounds-guarded unaligned loads/stores, gated by runtime CPU-feature detection); ureq and ureq-proto disable it, and without it the crate is #![forbid(unsafe_code)]. Only examples/base64.rs opens a user-named file."

