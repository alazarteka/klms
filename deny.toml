[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
db-path = "target/supply-chain-tools/advisory-db"
ignore = [
    { id = "RUSTSEC-2025-0057", reason = "fxhash 0.2.1 is an unmaintained transitive dependency through scraper/selectors; no patched release currently exists" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "proc-macro1", reason = "malware reported in the 2026-08-20 Rust supply-chain incident" },
    { crate = "proc-macro-en", reason = "malware reported in the 2026-08-20 Rust supply-chain incident" },
    { crate = "aovine", reason = "malware reported in the 2026-08-20 Rust supply-chain incident" },
    { crate = "arone", reason = "malware reported in the 2026-08-20 Rust supply-chain incident" },
    { crate = "aronenao", reason = "malware reported in the 2026-08-20 Rust supply-chain incident" },
    { crate = "tinymember", reason = "malware reported in the 2026-08-20 Rust supply-chain incident" },
    { crate = "arrayref@0.3.10", reason = "compromised release from the 2026-08-20 incident" },
    { crate = "internment@0.8.7", reason = "compromised release from the 2026-08-20 incident" },
    { crate = "append-only-vec@0.1.9", reason = "compromised release from the 2026-08-20 incident" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
