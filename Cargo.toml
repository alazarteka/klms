[package]
name = "klms"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "A fast, composable CLI for KAIST's Learning Management System"
license = "MIT"
repository = "https://github.com/alazarteka/klms"
readme = "README.md"
keywords = ["kaist", "klms", "moodle", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "klms"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.4", features = ["derive", "env"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
scraper = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
