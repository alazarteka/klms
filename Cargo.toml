[package]
name = "klms"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
description = "A fast, composable CLI for KAIST's Learning Management System"
license = "MIT"
repository = "https://github.com/alazarteka/klms"
readme = "README.md"
keywords = ["kaist", "klms", "moodle", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "klms"
path = "src/main.rs"

[dependencies]
cbc = { version = "=0.1.2", features = ["alloc", "zeroize"] }
clap = { version = "=4.6.4", features = ["derive", "env"] }
clap_complete = "=4.6.9"
kisaseed = { version = "=0.1.3", features = ["zeroize"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rpassword = "=7.5.4"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
scraper = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
