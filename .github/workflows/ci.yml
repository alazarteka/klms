name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # dtolnay/rust-toolchain exports CARGO_INCREMENTAL=0 unless it is already set.
  CARGO_INCREMENTAL: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Restored before the install step, which then finds 1.86.0 and its
      # components already present instead of downloading them.
      - name: Cache Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/1.86.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.86.0-x86_64-unknown-linux-gnu
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
        with:
          components: clippy,rustfmt
      # The release workflow builds from scratch; only CI reuses compiled
      # dependencies. A fresh checkout gives every source file a new mtime, so
      # klms itself always recompiles; the cached incremental state is what
      # makes that fast. The advisory database is excluded so deny always
      # checks a fresh copy.
      - name: Cache Cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/supply-chain-tools
          key: cargo-${{ runner.os }}-incremental-on-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check
        run: make check
