name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    steps:
      - name: Check out immutable event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Supply-chain workflow contract
        run: ./tests/supply_chain_contract.sh
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a # 1.86.0
        with:
          targets: ${{ matrix.target }}
      - name: Dependency security policy
        run: ./scripts/cargo-deny.sh --log-level info --locked check advisories bans sources licenses
      - name: Dependency review policy
        run: ./scripts/cargo-vet.sh check --locked --no-registry-suggestions
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build locked release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Verify binary and package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/klms"
          "$binary" --version
          "$binary" --help >/dev/null
          package="klms-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "$binary" "dist/$package/klms"
          cp README.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256")
          fi
      - name: Upload candidate artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
